{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Invitación | Admin</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Navegación Superior -->
    <nav class="top-nav">
        <div class="nav-brand">
            <i class="fa-solid fa-graduation-cap"></i> RSVP Admin
        </div>
        <div class="nav-links">
            <a href="{% url 'dashboard' %}" class="nav-link">
                <i class="fa-solid fa-arrow-left"></i> Volver al Dashboard
            </a>
        </div>
    </nav>

    <div class="invitation-container" style="margin-top: 80px;">
        <div class="invitation-card">
            <div class="graduation-cap-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            
            <h1 class="script-title" style="font-size: 3.5rem;">Nueva Invitación</h1>
            <p class="rsvp-subtitle">Generar link único para invitado</p>

            <!-- Mensajes de Django (Éxito/Error) -->
            {% if messages %}
                <div class="alert-messages">
                    {% for message in messages %}
                        <div class="alert {{ message.tags }}">
                            <i class="fa-solid {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %}"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'crear_invitacion' %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fa-regular fa-user"></i> Nombre completo del invitado
                    </label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez" class="form-input" autocomplete="off"/>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fa-regular fa-envelope"></i> Correo electrónico (Opcional)
                    </label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" class="form-input" autocomplete="off"/>
                </div>

                <button type="submit" class="btn-submit-rsvp" style="margin-top: 20px;">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    Generar Invitación
                </button>
            </form>
        </div>
    </div>

</body>
</html>
